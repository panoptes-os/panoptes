# cargo-mutants, as nix/rules/mutants.sh runs it.
exclude_re = [
  # The loom models and their fakes. cargo-mutants skips cfg(test) code,
  # but does not see cfg(all(test, panoptes_loom)) as test code.
  "loom_models::",
  # Debug output, which no test reads.
  "impl (std::)?fmt::Debug for ",
  # A policy's check() only asserts; emptying it changes no test's result.
  "::check with \\(\\)",
]
