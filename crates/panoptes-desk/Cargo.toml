[package]
name = "panoptes-desk"
description = "Panoptes per-agent control server: one Cage desktop over MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
panoptes-cgroup.workspace = true
png.workspace = true
rmcp.workspace = true
panoptes-sync.workspace = true
rustix.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The generated protocol bindings name wayland_backend directly.
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"

# The layers, as docs/design/verification.md defines them. nix/rules/
# checks what the policy files may name, and runs cargo-mutants on the
# lines a pull request changes in both lists.
[package.metadata.panoptes]
policy = ["src/lease.rs", "src/settle.rs", "src/windows.rs", "src/keymap.rs"]
threads = ["src/owner.rs", "src/handoff.rs"]

[lints]
workspace = true
