[package]
name = "panoptes-resd"
description = "Panoptes residency manager: freezes, parks, and wakes agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
panoptes-cgroup.workspace = true
panoptes-sync.workspace = true
rustix.workspace = true
serde_json.workspace = true
signal-hook.workspace = true

# The layers, as docs/design/verification.md defines them. nix/rules/
# checks what the policy files may name, and runs cargo-mutants on the
# lines a pull request changes in both lists.
[package.metadata.panoptes]
policy = ["src/policy.rs"]
threads = ["src/owner.rs", "src/worker.rs"]

[lints]
workspace = true
