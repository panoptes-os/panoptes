name: publish-image
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: nix build image
        run: nix build --print-build-logs .#image
      # tagged with the commit and as latest
      - name: push to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          repo=ghcr.io/panoptes-os/panoptes
          skopeo() { nix run nixpkgs#skopeo -- "$@" --authfile "$RUNNER_TEMP/auth.json"; }
          printf '%s' "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin
          skopeo copy docker-archive:result "docker://$repo:$SHA"
          skopeo copy "docker://$repo:$SHA" "docker://$repo:latest"
